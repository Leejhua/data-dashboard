services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-3015}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DAILY_OPS_LLM_ENABLED: ${DAILY_OPS_LLM_ENABLED}
      DAILY_OPS_LLM_API_KEY: ${DAILY_OPS_LLM_API_KEY}
      DAILY_OPS_LLM_API_URL: ${DAILY_OPS_LLM_API_URL}
      DAILY_OPS_LLM_MODEL: ${DAILY_OPS_LLM_MODEL:-deepseek-chat}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cron:
    image: alpine:3.19
    restart: always
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl
        echo "0 9 * * * curl -X POST http://dashboard:3000/api/dashboard/daily-ops/generate" >> /etc/crontabs/root
        crond -f

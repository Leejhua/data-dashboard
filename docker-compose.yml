services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN}
      ZULIN_INGEST_TOKEN: ${ZULIN_INGEST_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
